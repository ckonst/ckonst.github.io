# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout VNDecorrelate readme
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          repository: ckonst/VNDecorrelate
          path: VNDecorrelate
          sparse-checkout: |
            README.md
          # Required if checking out only single files outside of cone mode
          sparse-checkout-cone-mode: false

      - name: Remove dark mode media query HTML elements
        run: |
          python3 - <<'EOF'
          import re, sys

          file_path = "VNDecorrelate/README.md"

          with open(file_path, "r") as f:
              content = f.read()

          # Match any HTML tag (e.g. <style>...</style>) that contains the dark mode query
          pattern = re.compile(
              r'<(\w+)[^>]*>.*?@media\s*\(prefers-color-scheme:\s*dark\).*?</\1>',
              re.DOTALL | re.IGNORECASE
          )

          cleaned, count = pattern.subn("", content)

          with open(file_path, "w") as f:
              f.write(cleaned)

          print(f"Removed {count} element(s) containing dark mode media query.")
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
